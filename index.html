<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lógica Quest: O Jogo</title>
    <!-- Importação da fonte estilo videogame -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <!-- MathJax para renderizar as fórmulas lógicas -->
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = { tex: { inlineMath: [['$', '$']] } };
    </script>
    <style>
        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #0b0c10;
            color: #66fcf1;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        h1 {
            color: #45a29e;
            text-shadow: 2px 2px #000;
            font-size: 24px;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #1f2833;
            padding: 30px;
            border: 4px solid #66fcf1;
            border-radius: 10px;
            box-shadow: 0 0 15px #66fcf1;
        }
        .menu-btn {
            background-color: transparent;
            color: #66fcf1;
            border: 2px solid #66fcf1;
            padding: 15px 20px;
            margin: 10px;
            font-family: 'Press Start 2P', monospace;
            font-size: 14px;
            cursor: pointer;
            transition: 0.3s;
            width: 80%;
        }
        .menu-btn:hover {
            background-color: #66fcf1;
            color: #0b0c10;
        }
        .question-text {
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 25px;
            text-align: left;
        }
        .options-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .option-btn {
            background: #0b0c10;
            color: #c5c6c7;
            border: 2px solid #45a29e;
            padding: 15px;
            font-family: monospace;
            font-size: 16px;
            text-align: left;
            cursor: pointer;
            border-radius: 5px;
        }
        .option-btn:hover:not(:disabled) {
            border-color: #66fcf1;
            background: #1f2833;
        }
        .correct {
            background-color: #28a745 !important;
            color: #fff !important;
            border-color: #fff !important;
        }
        .wrong {
            background-color: #dc3545 !important;
            color: #fff !important;
            border-color: #fff !important;
        }
        #feedback {
            margin-top: 25px;
            font-size: 12px;
            line-height: 1.5;
            color: #ffeb3b;
        }
        #next-btn, #restart-btn {
            display: none;
            margin-top: 25px;
            background: #45a29e;
            color: #0b0c10;
            border: none;
            padding: 15px 20px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            width: 100%;
        }
        #next-btn:hover, #restart-btn:hover {
            background: #66fcf1;
        }
        #quiz-screen, #result-screen {
            display: none;
        }
        .hud {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 12px;
            color: #c5c6c7;
        }
    </style>
</head>
<body>

    <h1>LÓGICA MATEMÁTICA<br>QUEST</h1>

    <!-- Tela Inicial -->
    <div id="start-screen" class="container">
        <p>Selecione a fase para começar a revisão:</p>
        <button class="menu-btn" onclick="startBlock(0)">FASE 1: Argumentos Básicos (Q1-Q10)</button>
        <button class="menu-btn" onclick="startBlock(1)">FASE 2: Múltiplas Premissas (Q11-Q20)</button>
        <button class="menu-btn" onclick="startBlock(2)">FASE 3: Maior Complexidade (Q21-Q30)</button>
    </div>

    <!-- Tela do Quiz -->
    <div id="quiz-screen" class="container">
        <div class="hud">
            <span id="progress">Questão: 1/10</span>
            <span id="score">XP: 0</span>
        </div>
        <div id="question-text" class="question-text"></div>
        <div id="options" class="options-container"></div>
        <div id="feedback"></div>
        <button id="next-btn" onclick="nextQuestion()">PRÓXIMA FASE &gt;</button>
    </div>

    <!-- Tela de Resultados -->
    <div id="result-screen" class="container">
        <h2>FIM DE JOGO</h2>
        <p id="final-score" style="margin: 30px 0; line-height: 2;"></p>
        <button id="restart-btn" style="display: block;" onclick="location.reload()">VOLTAR AO MENU PRINCIPAL</button>
    </div>

            {

        let currentBlock = [];
        let currentIndex = 0;
        let score = 0;
        let answered = false;

        function startBlock(blockIndex) {
            // Separa as questões de 10 em 10 baseado na escolha
            const start = blockIndex * 10;
            currentBlock = allQuestions.slice(start, start + 10);
            currentIndex = 0;
            score = 0;
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'block';
            
            loadQuestion();
        }

        function loadQuestion() {
            answered = false;
            const q = currentBlock[currentIndex];
            
            document.getElementById('progress').innerText = `Questão: ${currentIndex + 1}/10`;
            document.getElementById('score').innerText = `XP: ${score * 100}`;
            document.getElementById('question-text').innerHTML = q.q;
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('next-btn').style.display = 'none';
            
            const optionsDiv = document.getElementById('options');
            optionsDiv.innerHTML = '';
            
            q.opts.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = opt;
                btn.onclick = () => checkAnswer(index, btn);
                optionsDiv.appendChild(btn);
            });

            // Força o MathJax a renderizar as novas fórmulas na tela
            MathJax.typesetPromise();
        }

        function checkAnswer(selectedIndex, btn) {
            if (answered) return;
            answered = true;
            
            const q = currentBlock[currentIndex];
            const allBtns = document.querySelectorAll('.option-btn');
            
            // Desabilita os botões após a resposta
            allBtns.forEach(b => b.disabled = true);
            
            if (selectedIndex === q.ans) {
                btn.classList.add('correct');
                document.getElementById('feedback').innerHTML = `✅ ACERTOU! +100 XP<br><br><strong>Explicação:</strong> ${q.just}`;
                score++;
            } else {
                btn.classList.add('wrong');
                allBtns[q.ans].classList.add('correct');
                const letras = ['A', 'B', 'C', 'D', 'E'];
                document.getElementById('feedback').innerHTML = `❌ GAME OVER! A correta era a alternativa ${letras[q.ans]}.<br><br><strong>Explicação:</strong> ${q.just}`;
            }
            
            // Renderiza novamente a matemática, caso o texto da explicação tenha símbolos
            MathJax.typesetPromise();
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentBlock.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('result-screen').style.display = 'block';
            document.getElementById('final-score').innerHTML = `Fase Concluída!<br>Acertos: ${score}/10<br>Total de XP: ${score * 100}`;
        }
    </script>
</body>
</html>
